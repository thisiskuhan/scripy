name: Desktop Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            build: --linux AppImage tar.gz --x64
          - runner: windows-latest
            platform: windows-x64
            build: --win nsis --x64
          - runner: macos-latest
            platform: macos-universal
            build: --mac dmg zip --universal
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Native smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs
        env:
          SCRIPY_TEST_NO_SANDBOX: '1'
      - name: Native smoke test on Windows and macOS
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs
      - name: Package desktop artifacts
        run: npx electron-builder ${{ matrix.build }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: scripy-${{ matrix.platform }}
          path: release/*/Scripy-*
          if-no-files-found: error
